  <style>
    .sxq-load{position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2vh,24px);background:#f7f6f2;transition:opacity .45s ease,visibility .45s ease;padding:4vh 4vw;box-sizing:border-box}
    .sxq-load.sxq-load-hide{opacity:0;visibility:hidden}
    .sxq-load-fx{width:min(62vmin,520px);height:min(62vmin,520px);max-width:92vw;max-height:62vh;-webkit-mask-image:radial-gradient(closest-side,#000 66%,transparent 100%);mask-image:radial-gradient(closest-side,#000 66%,transparent 100%)}
    .sxq-load-hello{width:min(56vw,420px);height:auto;aspect-ratio:500/150;max-height:24vh}
    .sxq-load-txt{font-size:clamp(13px,2vmin,19px);letter-spacing:clamp(4px,1.2vw,8px);color:#d6482f}
    @media(max-width:640px){
      .sxq-load-fx{width:min(78vw,400px);height:min(78vw,400px);-webkit-mask-image:radial-gradient(closest-side,#000 66%,transparent 100%);mask-image:radial-gradient(closest-side,#000 66%,transparent 100%)}
      .sxq-load-hello{width:min(74vw,300px)}
    }
    .drawer .sxq-hint{font-size:12px;color:#8a8580;margin:2px 0 6px;line-height:1.6}
    .drawer .sxq-menu{margin:6px 0 4px}
  </style>
</head>
<body>

        <a data-nav="lost">

          <span>失物</span>

      <button class="xq-nav-pub" id="sidePublish">

        发布

      <a class="xq-nav-side" href="https://kernthal.github.io/shangxianquan-official/corridor/" target="_blank" rel="noopener">

    <!-- 顶栏 -->
    <header class="hd">
      <div class="hd-in">

        <div class="hd-user" id="hdUser"></div>
        <button class="burger" id="burger" aria-label="菜单">
          <span class="bl l1"></span><span class="bl l2"></span><span class="bl l3"></span>
        </button>
      </div>
    </header>

    <!-- 抽屉导航 -->
    <div class="drawer-mask" id="drawerMask" hidden></div>
    <nav class="drawer" id="drawer" hidden>
      <div class="drawer-head"><span class="hd-seal">贤</span><span>贤圈中心</span></div>
      <p class="sxq-hint">悬停查看动效，点击进入对应页面。</p>

    <!-- 主内容 -->
    <main id="main"></main>

    <!-- 发布球（PC） -->
    <button class="fab" id="fab" title="发布">＋</button>

    <!-- 底部导航（移动端） -->
    <nav class="tabbar">
      <a data-nav="feed" class="on">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none"><path d="M12 3.2l8.6 7.4h-2.7v9.4h-4.4v-5.8h-3v5.8H6.1v-9.4H3.4L12 3.2z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>

        <span>集市</span>
      </a>
      <button class="tab-plus" id="tabPlus" title="发布"><span>＋</span></button>
      <a data-nav="ask">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none"><circle cx="12" cy="12" r="8.8" stroke="currentColor" stroke-width="1.7"/><path d="M9.6 9.2a2.5 2.5 0 015 0c0 1.6-2.5 2-2.5 3.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M12 16.4h.01" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
        <span>提问</span>
      </a>
      <a data-nav="me" id="tabMe">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none"><circle cx="12" cy="8.4" r="3.7" stroke="currentColor" stroke-width="1.7"/><path d="M4.6 20.2a7.4 7.4 0 0114.8 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span>我的</span>
      </a>
    </nav>

    <!-- 登录浮层 -->
    <div class="mask" id="authMask" hidden>
      <div class="auth-card">
        <div class="auth-seal">贤</div>
        <div class="auth-title" id="authTitle">登录贤圈中心</div>
        <div class="auth-sub">使用尚贤圈 App 账号（同一账号体系），贤圈ID 自动关联</div>
        <input class="ipt" id="authEmail" type="email" placeholder="邮箱" autocomplete="email" />
        <input class="ipt" id="authPass" type="password" placeholder="密码（至少 6 位）" autocomplete="current-password" />
        <div id="authCodeRow" hidden>
          <input class="ipt" id="authCode" inputmode="numeric" maxlength="6" placeholder="邮箱验证码（6 位）" />
        </div>
        <button class="btn btn-primary" id="authSubmit">登录</button>
        <div class="auth-or">—— 或 ——</div>
        <button class="btn oauth-btn" id="oauthBtn">用尚贤圈 App 账号一键登录</button>
        <div class="auth-switch"><a id="authModeBtn">注册新账号</a> · <a id="authForgot">忘记密码</a></div>
        <button class="auth-close" id="authClose">暂不登录，先看看</button>
      </div>
    </div>

    <!-- 通用弹层（详情 / 发布 / 通知 / 搜索 / 图片放大） -->

    <!-- 底栏 -->

  <!-- 尚贤圈 · Lottie 运行时 + 智能客服（本地资源） -->
  <script>
    window.SXQ_LOTTIE_BASE = './assets/lottie/';
    window.SXQ_LOTTIE_VENDOR = './assets/vendor/lottie.min.js';
    window.SXQ_AI = {
      title: '贤圈中心 · 智能客服',
      email: 'sxcommunity@outlook.com',
      faq: ['怎么发布动态？', '集市怎么用？', '提问区怎么提问？', '怎么登录？', '鸣谢名单是什么？']

  <script src="./assets/sxq/sxq-lottie.js"></script>
  <script src="./assets/sxq/sxq-nav.js"></script>
  <script src="./assets/sxq/sxq-ai-chat.js"></script>
  <script>
    (function () {
      // 首屏加载动画：至少展示 2.2 秒，最多 8 秒兜底
      var t0 = Date.now(), done = false;
      function hideLoad () {
        if (done) return;
        done = true;
        var el = document.getElementById('sxqLoad');
        if (!el) return;
        var wait = Math.max(0, 2200 - (Date.now() - t0));
        setTimeout(function () {
          el.classList.add('sxq-load-hide');
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 500);
        }, wait);
      }
      if (document.readyState === 'complete') hideLoad();
      else window.addEventListener('load', hideLoad);
      setTimeout(hideLoad, 8000);
    })();
  </script>
</body>
</html>
