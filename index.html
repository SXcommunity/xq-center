<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>贤圈中心 · 尚贤圈</title>
  <meta name="description" content="贤圈中心：日常动态、专属提问、学业互助——桂林市尚贤学校校园社区。" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="theme-color" content="#f7f6f2" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <div id="app">

    <!-- 顶栏 -->
    <header class="hd">
      <div class="hd-in">
        <div class="hd-brand" data-nav="feed">
          <span class="hd-seal">贤</span>
          <span class="hd-name">贤圈中心</span>
        </div>
        <nav class="hd-nav">
          <a data-nav="feed" class="on">广场</a>
          <a data-nav="market">集市</a>
          <a data-nav="ask">提问</a>
          <a data-nav="thanks">鸣谢</a>
          <a data-nav="me">我的</a>
        </nav>
        <div class="hd-user" id="hdUser"></div>
        <button class="burger" id="burger" aria-label="菜单">
          <span class="bl l1"></span><span class="bl l2"></span><span class="bl l3"></span>
        </button>
      </div>
    </header>

    <!-- 抽屉导航 -->
    <div class="drawer-mask" id="drawerMask" hidden></div>
    <nav class="drawer" id="drawer" hidden>
      <div class="drawer-head"><span class="hd-seal">贤</span><span>贤圈中心</span></div>
      <a data-nav="feed"><i>01</i>广场</a>
      <a data-nav="market"><i>02</i>集市</a>
      <a data-nav="ask"><i>03</i>提问</a>
      <a data-nav="thanks"><i>04</i>鸣谢</a>
      <a data-nav="me"><i>05</i>我的</a>
      <div class="drawer-foot">全实名 · 友善交流</div>
    </nav>

    <!-- 主内容 -->
    <main id="main"></main>

    <!-- 发布球 -->
    <button class="fab" id="fab" title="发布">＋</button>

    <!-- 底部导航（移动端） -->
    <nav class="tabbar">
      <a data-nav="feed" class="on"><span>广场</span></a>
      <a data-nav="market"><span>集市</span></a>
      <button class="tab-plus" id="tabPlus" title="发布"><span>＋</span></button>
      <a data-nav="ask"><span>提问</span></a>
      <a data-nav="me"><span>我的</span></a>
    </nav>

    <!-- 登录浮层 -->
    <div class="mask" id="authMask" hidden>
      <div class="auth-card">
        <div class="auth-seal">贤</div>
        <div class="auth-title">登录贤圈中心</div>
        <div class="auth-sub">使用尚贤圈 App 账号（同一账号体系），贤圈ID 自动关联</div>
        <input class="ipt" id="authEmail" type="email" placeholder="邮箱" autocomplete="email" />
        <input class="ipt" id="authPass" type="password" placeholder="密码（至少 6 位）" autocomplete="current-password" />
        <div id="authCodeRow" hidden>
          <input class="ipt" id="authCode" inputmode="numeric" maxlength="6" placeholder="邮箱验证码（6 位）" />
        </div>
        <button class="btn btn-primary" id="authSubmit">登录</button>
        <div class="auth-or">—— 或 ——</div>
        <button class="btn oauth-btn" id="oauthBtn">用尚贤圈 App 账号一键登录</button>
        <div class="auth-switch"><a id="authModeBtn">注册新账号</a> · <a id="authForgot">忘记密码</a></div>
        <button class="auth-close" id="authClose">暂不登录，先看看</button>
      </div>
    </div>

    <!-- 编辑浮层 -->
    <div class="mask" id="editMask" hidden><div class="edit-card" id="editCard"></div></div>

    <!-- 底栏 -->
    <footer class="ftbar">
      <a href="https://kernthal.github.io/shangxianquan-official/" target="_blank" rel="noopener">尚贤圈官网</a>
      <span>· 桂林市尚贤学校校园社区 ·</span>
      <a href="https://ifdian.net/a/kernthal-sxquan" target="_blank" rel="noopener">爱发电支持</a>
      <span class="ft-ver" id="ftVer"></span>
    </footer>

    <div class="toast" id="toast" hidden></div>
  </div>

  <script src="./assets/vendor/supabase.js"></script>
  <script src="./assets/app.js"></script>
</body>
</html>
